<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Author-selected DiffusionART text-to-video and text-to-image results alongside pretrained references.">
  <title>Visual results | DiffusionART</title>
  <link rel="stylesheet" href="style.css?v=insights-v4">
  <script src="media.js?v=hf-demo-v1" defer></script>
  <script src="demo.js?v=demo-v2" defer></script>
</head>
<body class="demo-page">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a href="index.html" class="wordmark"><img src="assets/logo.svg" width="170" height="36" alt="DiffusionART"></a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="demo.html" aria-current="page">Demo</a>
    </nav>
  </header>

  <main id="main" class="wrap">
    <header class="demo-heading"><h1>Visual results</h1></header>
    <div class="demo-tabs result-tabs" role="tablist" aria-label="Generation task" aria-orientation="horizontal">
      <button id="tab-video" type="button" role="tab" aria-selected="true" aria-controls="panel-video" tabindex="0">Text to video</button>
      <button id="tab-image" type="button" role="tab" aria-selected="false" aria-controls="panel-image" tabindex="-1">Text to image</button>
    </div>

    <section id="panel-video" class="demo-panel" role="tabpanel" aria-labelledby="tab-video" tabindex="0">
      <div class="gallery-heading">
        <h3>HunyuanVideo-13B</h3>
        <div class="pair-actions">
          <button type="button" id="play-pair" class="icon-button" title="Play both videos" aria-label="Play both videos" disabled><img src="assets/play.svg" alt="" width="18" height="18"></button>
          <button type="button" id="replay-pair" class="icon-button" title="Replay both videos" aria-label="Replay both videos" disabled><img src="assets/rotate-ccw.svg" alt="" width="18" height="18"></button>
        </div>
      </div>
      <p id="video-prompt" class="prompt">Ocean waves roll onto a black sand beach beneath towering green cliffs.</p>
      <div class="video-pair">
        <figure><figcaption>Pretrained</figcaption><video id="video-before" playsinline muted preload="none" poster="assets/hf-video-00100-before.jpg" aria-label="Pretrained video"></video></figure>
        <figure><figcaption class="art-label">DiffusionART</figcaption><video id="video-after" playsinline muted preload="none" poster="assets/hf-video-00100-after.jpg" aria-label="DiffusionART video"></video></figure>
      </div>
      <p id="video-status" class="media-status" role="status" aria-live="polite" aria-atomic="true"></p>
      <div id="video-choices" class="choices" role="group" aria-label="Video examples"></div>
      <details class="provenance"><summary>Video details</summary><p id="video-details"></p></details>
    </section>

    <section id="panel-image" class="demo-panel" role="tabpanel" aria-labelledby="tab-image" tabindex="-1" hidden inert>
      <div class="gallery-heading"><h3>SD3.5-M</h3><span id="image-benchmark" class="benchmark"></span></div>
      <p id="image-prompt" class="prompt"></p>
      <div class="image-pair">
        <figure><figcaption>Pretrained</figcaption><img id="image-before" alt="Pretrained image" loading="lazy" width="512" height="512"></figure>
        <figure><figcaption class="art-label">DiffusionART</figcaption><img id="image-after" alt="DiffusionART image" loading="lazy" width="512" height="512"></figure>
      </div>
      <p id="image-status" class="media-status" role="status" aria-live="polite" aria-atomic="true"></p>
      <div id="image-choices" class="choices" role="group" aria-label="Image examples"></div>
      <details class="provenance"><summary>Image details</summary><p id="image-details"></p></details>
    </section>

    <noscript><p class="selection-note"><a href="assets/hf-video-00100-before.mp4">Pretrained video</a> / <a href="assets/hf-video-00100-after.mp4">DiffusionART video</a> / <a href="assets/image-chicago-before.jpg">Pretrained image</a> / <a href="assets/image-chicago-after.jpg">DiffusionART image</a></p></noscript>
  </main>

  <footer class="wrap"><p>DiffusionART</p><a href="https://github.com/vanzll/diffusionart-project">Website source</a></footer>
</body>
</html>
